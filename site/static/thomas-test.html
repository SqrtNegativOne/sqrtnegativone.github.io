<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thomas Attractor Isolated Test</title>
  <style>
    body, html { margin: 0; padding: 0; overflow: hidden; background: oklch(0.117 0.0089 284.95); }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script type="module">
    import { createThomasWebGL } from '/src/components/visualizations/thomas-webgl.js';
    import { createThomas } from '/src/components/visualizations/thomas.js';

    const canvas = document.getElementById("canvas");
    const webglViz = createThomasWebGL();
    const useWebGL = webglViz.init(canvas);

    let viz, ctx;
    if (useWebGL) {
      viz = webglViz;
      ctx = null;
    } else {
      webglViz.destroy();
      ctx = canvas.getContext("2d", { alpha: false });
      viz = createThomas();
    }

    let W, H, animId;
    let targetAz = 0, targetEl = 0.3, az = 0, el = 0.3;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width  = (W * dpr) | 0;
      canvas.height = (H * dpr) | 0;
      canvas.style.width  = W + "px";
      canvas.style.height = H + "px";
      if (!useWebGL) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      viz.resize(W, H);
    }

    const cachedColors = { bg: "5,5,8", litBase: 42, litSpd: 32 };
    if (useWebGL) viz.setColors(cachedColors);

    function render() {
      az += (targetAz - az) * 0.06;
      el += (targetEl - el) * 0.06;
      viz.frame(ctx, W, H, az, el, cachedColors);
      animId = requestAnimationFrame(render);
    }

    function onMouseMove(e) {
      targetAz = ((e.clientX / W) - 0.5) * Math.PI * 2;
      targetEl = ((e.clientY / H) - 0.5) * Math.PI * 0.8;
    }

    window.addEventListener("mousemove", onMouseMove);
    window.addEventListener("resize", () => {
      cancelAnimationFrame(animId);
      resize();
      render();
    });

    resize();
    if (!useWebGL) viz.init(ctx, W, H);
    render();
  </script>
</body>
</html>
