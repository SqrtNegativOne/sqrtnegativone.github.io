name: Deploy to Cloudflare Workers

# Staged migration: this is NOT wired to push yet.
# To flip from GitHub Pages to Cloudflare:
#   1. Swap svelte.config.js to @sveltejs/adapter-cloudflare.
#   2. Set the real D1 database_id in wrangler.jsonc.
#   3. Add repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
#   4. Add a `push: branches: ["main"]` trigger (and disable/remove the Pages workflow).
on:
  workflow_dispatch:

concurrency:
  group: "deploy-cloudflare"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
