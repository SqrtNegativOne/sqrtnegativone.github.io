[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = ["protocol-asset"] }
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "charset", "http2", "system-proxy", "native-tls"] }
base64 = "0.23.1"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"

# Keep dev builds quick to compile and reasonably small. Full debug info is
# what balloons target/debug to tens of GB; we rarely debug the Rust side.
[profile.dev]
debug = 0
incremental = true
